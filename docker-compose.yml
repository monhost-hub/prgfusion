# ============================================================================
# AllCombiner — docker-compose.yml (for VPS / Cloud deployment)
# ============================================================================
# Usage:
#   cp .env.production.example .env
#   # edit .env with real values
#   docker compose up -d --build
#
# View logs:
#   docker compose logs -f allcombiner
#
# Stop:
#   docker compose down
# ============================================================================

services:
  allcombiner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allcombiner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # All env vars come from .env file (git-ignored)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://www.allcombiner.com}
      DATABASE_URL: ${DATABASE_URL:-file:./data/prod.db}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@allcombiner.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://www.allcombiner.com}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-AllCombiner}
      RATE_LIMIT_FUSION_PER_HOUR: ${RATE_LIMIT_FUSION_PER_HOUR:-10}
      RATE_LIMIT_CONTACT_PER_HOUR: ${RATE_LIMIT_CONTACT_PER_HOUR:-5}
      RATE_LIMIT_AUTH_PER_HOUR: ${RATE_LIMIT_AUTH_PER_HOUR:-20}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_UPLOAD_DIMENSION: ${MAX_UPLOAD_DIMENSION:-4096}
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    volumes:
      # Persist SQLite database (if used)
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - allcombiner-net

  # Optional: PostgreSQL if you want a real DB instead of SQLite
  # Uncomment and update DATABASE_URL in .env to use it
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: allcombiner-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: allcombiner
  #     POSTGRES_USER: allcombiner
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - allcombiner-net

networks:
  allcombiner-net:
    driver: bridge

