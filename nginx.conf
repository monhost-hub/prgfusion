# ============================================================================
# AllCombiner — Nginx reverse proxy configuration
# ============================================================================
# Use this if you deploy on a VPS and want Nginx in front of the Node.js app
# to handle HTTPS (Let's Encrypt) and proxy requests to localhost:3000.
#
# Setup (Ubuntu/Debian):
#   1. sudo cp nginx.conf /etc/nginx/sites-available/allcombiner
#   2. sudo ln -s /etc/nginx/sites-available/allcombiner /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d allcombiner.com -d www.allcombiner.com
#   4. sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Rate limiting zone (protect against basic DDoS)
limit_req_zone $binary_remote_addr zone=allcombiner_limit:10m rate=10r/s;

# Upstream (the Next.js app)
upstream allcombiner_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name allcombiner.com www.allcombiner.com;

    # ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name allcombiner.com www.allcombiner.com;

    # SSL (paths filled by certbot)
    ssl_certificate /etc/letsencrypt/live/allcombiner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allcombiner.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/allcombiner.com/chain.pem;

    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max upload size (must match MAX_UPLOAD_SIZE_MB)
    client_max_body_size 15M;

    # Logs
    access_log /var/log/nginx/allcombiner-access.log;
    error_log  /var/log/nginx/allcombiner-error.log;

    # Rate limiting
    limit_req zone=allcombiner_limit burst=20 nodelay;

    # Next.js static files (served directly by Nginx for performance)
    location /_next/static/ {
        alias /home/$(whoami)/allcombiner/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public assets
    location /public/ {
        alias /home/$(whoami)/allcombiner/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # robots.txt and sitemap.xml (serve from app)
    location = /robots.txt {
        proxy_pass http://allcombiner_app;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://allcombiner_app;
        proxy_set_header Host $host;
        add_header Content-Type "application/xml";
    }

    # Main proxy to Next.js
    location / {
        proxy_pass http://allcombiner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (AI fusion can take 60-120s)
        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
